# Shannon Direct-IO PCIe driver — IOMMU passthrough requirement.
#
# The Shannon device uses dma_alloc_coherent for its command/completion
# buffers. On kernels >= 6.0 (e.g. Ubuntu 6.8 noble, 6.17) the Intel IOMMU
# is enabled by default with translated DMA (IOVA). The device firmware
# cannot operate correctly with IOVA-translated DMA — under heavy write
# load the device stops completing write-buffer commands, causing a
# permanent stall (bufq_alloc_cmd_sleepable blocked).
#
# Setting iommu=pt puts the IOMMU in passthrough (identity) mode so the
# device's DMA address equals the physical address, matching the behaviour
# on kernels <= 5.15 where the IOMMU is off by default.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} intel_iommu=on iommu=pt"
